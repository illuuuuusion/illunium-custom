name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        run: ./gradlew clean check build --no-daemon

      - name: Hash and build info
        run: |
          cd build/libs
          sha256sum IlluniumCustom-*.jar > SHA256SUMS
          {
            echo "commit=$GITHUB_SHA"
            echo "jar=$(ls IlluniumCustom-*.jar)"
            echo "java=$(java -version 2>&1 | head -1)"
            echo "paper-api=26.3.build.207-stable"
            echo "schema=$(ls ../../src/main/resources/db/migrations | wc -l)"
          } > build-info.txt
          cat SHA256SUMS build-info.txt

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: IlluniumCustom
          path: |
            build/libs/IlluniumCustom-*.jar
            build/libs/SHA256SUMS
            build/libs/build-info.txt
          if-no-files-found: error

  # Rolling "latest" release: replaced on every push to main, so the newest JAR is always downloadable.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-release
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v8
        with:
          name: IlluniumCustom

      - name: Publish latest release
        run: |
          mv IlluniumCustom-*.jar IlluniumCustom.jar
          sha256sum IlluniumCustom.jar > IlluniumCustom.jar.sha256
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest IlluniumCustom.jar IlluniumCustom.jar.sha256 build-info.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automatic build of $GITHUB_SHA from main. Development build: test on the separate test server before any production rollout."
