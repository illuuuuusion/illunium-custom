name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        run: ./gradlew clean check build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: IlluniumCustom
          path: build/libs/IlluniumCustom-*.jar
          if-no-files-found: error
