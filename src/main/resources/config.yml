# IlluniumCustom configuration. Changes apply on server restart; no secrets belong here.

# Feature modules (true/false). A module missing here is enabled.
modules:
  recipes: true
  groups: true
  marriage: true
  playtime: true
  whitelistguard: true
  whiteliststaging: true
  sit: true
  vanish: true
  spawn: true
  leaderboard: true
  emotes: true
  playtimecolors: true
  beacons: true

storage:
  # SQLite file inside the plugin folder.
  filename: data.db

groups:
  gec:
    enabled: true
    min-members: 4 # Fixed in v1.4; other values are rejected.
    slots: 27 # Fixed in v1.4.
  chat:
    enabled: true
    message-max-length: 256 # 1..256 Unicode codepoints.
    cooldown-seconds: 1 # 0..10; 0 disables the per-sender cooldown.

marriage:
  # Tablist symbol when the partner is offline. If the vanilla font does not render it, use e.g. "✕❤".
  offline-symbol: "💔"

whitelistguard:
  # Seconds between consistency checks (5..3600): whitelist on, enforcement on, staff present. No network per check.
  check-interval-seconds: 30
  # Protected server staff (NOT group mods). Each entry must be the Mojang UUID and current name of the account;
  # it is verified against Mojang once per start and only then re-added to the native whitelist if missing.
  # Example: - {uuid: "069a79f4-44e9-4726-a5be-fca90e38aaf5", name: "Notch"}
  staff: []

vanish:
  auto-vanish-default: true
  # Minecraft account UUID: boolean. Overrides affect the next join after a server restart.
  auto-vanish-overrides: {}

leaderboard:
  # 30..3600 seconds after completing a snapshot. Always 10 rows, all OPs excluded.
  cache-seconds: 60

emotes:
  enabled-in-public-chat: true
  enabled-in-group-chat: true
  tab-completion: true
  # alias: symbol. Exact ":alias:" tokens, case-insensitive; at most 64 aliases, symbols 1..8 characters.
  # The vanilla font may draw emoji monochrome; if a glyph shows as a box, use a fallback such as "☠" for skull.
  aliases:
    skull: "💀"
    heart: "❤"
    broken_heart: "💔"
    smile: "☺"
    sad: "☹"
    star: "★"
    check: "✔"
    cross: "✖"
    sun: "☀"
    music: "♫"

playtimecolors:
  # Exactly 10 tiers, hours strictly ascending from 0 (inclusive), color a Minecraft colour name. Needs playtime.
  tiers:
    - {hours: 0, color: GRAY}
    - {hours: 10, color: WHITE}
    - {hours: 30, color: GREEN}
    - {hours: 75, color: DARK_AQUA}
    - {hours: 150, color: AQUA}
    - {hours: 300, color: BLUE}
    - {hours: 500, color: LIGHT_PURPLE}
    - {hours: 800, color: RED}
    - {hours: 1200, color: GOLD}
    - {hours: 2000, color: YELLOW}

beacons:
  # Covered beacons (opaque roof) give the effects selected in the vanilla menu; the beam stays hidden by the roof.
  allow-covered-effects: true
  # Must stay false: hiding the beam under a free sky is not possible without client mods (Patch v1.5 B1 blocked).
  beam-toggle-enabled: false
  effect-refresh-ticks: 80 # 20..200; vanilla uses 80
